{% extends 'base.html' %}

{% block title %}
Password Changed
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <h2>
            Password Changed Successfully
        </h2>

        <p>
            Your CrazyEats password has been changed successfully.
        </p>

        <p>
            You can now log in using your new password.
        </p>


        <a
            href="{% url 'login' %}"
            class="auth-btn"
        >
            Login
        </a>

    </div>

</section>

{% endblock %}
