{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <h2>Create Account</h2>

        <p>Join CrazyEats today.</p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">

                Create Account

            </button>

        </form>

        <p class="auth-link">

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </p>

    </div>

</section>

{% endblock %}
