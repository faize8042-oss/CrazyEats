{% extends 'base.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <h2>
            Forgot Your Password?
        </h2>

        <p>
            Enter the email address associated with your account.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="auth-btn"
            >
                Send Reset Link
            </button>

        </form>


        <p class="auth-link">

            <a href="{% url 'login' %}">
                ← Back to Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
