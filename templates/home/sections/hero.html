<section class="hero">

    <div class="container hero-container">

        <div class="hero-left">

            <span class="badge">
                🚀 Fast Delivery in 30 Minutes
            </span>

            <h1>
                Delicious Food Delivered
                <span>Right To Your Door</span>
            </h1>

            <p>
                Discover thousands of restaurants, exclusive deals,
                and lightning-fast delivery from your favorite local restaurants.
            </p>

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search restaurants or dishes">

                <button>
                    🔍 Search
                </button>

            </div>

            <div class="popular-searches">

                <strong>Popular:</strong>

                <a href="#">Pizza</a>

                <a href="#">Burger</a>

                <a href="#">Biryani</a>

                <a href="#">Chinese</a>

            </div>

        </div>

        <div class="hero-right">

            {% load static %}

            <img
            src="{% static 'images/hero/hero-pizza.png' %}"
            alt="Food">

        </div>

    </div>

</section>
