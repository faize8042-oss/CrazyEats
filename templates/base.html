{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CrazyEats{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
{% include "includes/demo_banner.html" %}

    {% include 'includes/navbar.html' %}

    <main>
        {% if messages %}<div class="container flash-messages" role="status">{% for message in messages %}<p class="flash {{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}

        {% block content %}

        {% endblock %}

    </main>

    {% include 'includes/footer.html' %}

    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
